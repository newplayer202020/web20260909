<!DOCTYPE html>
<html>
  <head>
    <title>資訊三甲 許善智 九九乘法表</title>

<style>
        td {
         border: 1px solid;
         border-collapse: collapse;
    }
     th, td {
  background-color: #bca5c5;
}
</style>
 </head>
<script>
    document.write("<table align='center'>");
    for (let i = 1; i <= 9; i++) {
        document.write("<tr>");
        for (let j = 1; j <= i ; j++) {
           

            document.write("<td>");
            document.write(i + " * " + j + " = " + (i * j) + "&nbsp;&nbsp;&nbsp;");
        
            document.write("</td>");
        }
        document.write("</tr>");
    }
    document.write("</table>");
</script>
<body>
    
    <p>資訊三甲 許善智 九九乘法表</p>
</body>
